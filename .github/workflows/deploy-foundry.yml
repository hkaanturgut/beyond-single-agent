name: Deploy Azure infrastructure

on:
  workflow_dispatch:
    inputs:
      resource_group_name:
        description: Azure resource group to deploy into
        required: true
        default: rg-trip-planner-dev
      location:
        description: Azure region for the deployment
        required: true
        default: eastus2
      environment_name:
        description: Short environment label used in resource names
        required: true
        default: dev
      model_deployment_name:
        description: Foundry model deployment name
        required: true
        default: gpt-4.1-mini

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP_NAME: ${{ inputs.resource_group_name }}
      LOCATION: ${{ inputs.location }}
      ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      MODEL_DEPLOYMENT_NAME: ${{ inputs.model_deployment_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Ensure resource group exists
        run: az group create --name "$RESOURCE_GROUP_NAME" --location "$LOCATION"

      - name: Deploy Azure resources
        run: |
          FOUNDRY_HUB_NAME="foundry-trip-planner-${ENVIRONMENT_NAME}"
          FOUNDRY_PROJECT_NAME="trip-planner-${ENVIRONMENT_NAME}"
          DEPLOYMENT_NAME="trip-planner-${GITHUB_RUN_ID}"

          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.bicepparam \
            environmentName="$ENVIRONMENT_NAME" \
            location="$LOCATION" \
            foundryHubName="$FOUNDRY_HUB_NAME" \
            foundryProjectName="$FOUNDRY_PROJECT_NAME" \
            modelDeploymentName="$MODEL_DEPLOYMENT_NAME"

      - name: Capture deployment outputs
        run: |
          DEPLOYMENT_NAME="trip-planner-${GITHUB_RUN_ID}"

          FOUNDRY_PROJECT_ENDPOINT=$(az deployment group show \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query "properties.outputs.foundryProjectEndpoint.value" \
            -o tsv)

          FOUNDRY_MODELS_ENDPOINT=$(az deployment group show \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query "properties.outputs.foundryModelsEndpoint.value" \
            -o tsv)

          {
            echo "### Azure deployment complete"
            echo ""
            echo "- Resource group: \`$RESOURCE_GROUP_NAME\`"
            echo "- Foundry project endpoint: \`$FOUNDRY_PROJECT_ENDPOINT\`"
            echo "- Foundry models endpoint: \`$FOUNDRY_MODELS_ENDPOINT\`"
          } >> "$GITHUB_STEP_SUMMARY"
